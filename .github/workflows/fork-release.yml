name: Fork Release (macOS)

# Builds this fork and publishes a macOS release to THIS repo's releases, which is
# where the packaged app's updater feed points (see src/main/updater/updater-setup.ts).
#
# This fork ships unsigned on purpose. Squirrel.Mac refuses an unsigned bundle, so on macOS the
# app installs its own updates instead: it downloads the zip published here, checks it against
# latest-mac.yml and swaps the bundle itself (see src/main/updater/fork-install/).
#
# Each release is titled with the fork's own version and the upstream Orca it is based on, e.g.
# "1.4.233 (Orca 1.4.214)", and its notes carry the fork's changes plus upstream's own notes for
# any upstream releases a sync brought in (see config/scripts/fork-release-notes.mjs).
#
# If you ever add signing, set MAC_CERTS / MAC_CERTS_PASSWORD / APPLE_ID /
# APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID as repository secrets — this workflow picks
# them up automatically — and set ORCA_UPDATE_AUTO_INSTALL=1 in the app to restore
# download-and-install.
#
#   gh workflow run fork-release.yml --ref main

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build (default: the branch selected above)'
        required: false
        default: ''
        type: string
      version:
        # Why the fork counts its own versions: the updater only reports an update when the published
        # version is higher than the installed one, and upstream's package.json version moves at
        # upstream's pace — a sync can even land a lower number than the fork has already shipped.
        description: 'Override the release version (default: the newest fork release plus one). Must be higher than the installed build for the update notice to fire.'
        required: false
        default: ''
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: fork-release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Why the full history: the release notes are the fork's commits since the previous
          # release tag, and a shallow clone has neither the tag nor the commits between.
          fetch-depth: 0

      # Why upstream is fetched: a commit reachable from upstream/main is upstream's, which is how
      # the notes tell the fork's own work apart from everything a sync merge brought in.
      - name: Resolve the version and write the release notes
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/stablyai/orca.git
          git fetch upstream main --quiet --no-tags
          node config/scripts/fork-release-notes.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --version "${REQUESTED_VERSION:-}" \
            --out release-notes.md
          echo "--- release notes ($(wc -c < release-notes.md) chars) ---"
          head -40 release-notes.md

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Why corepack rather than proto: package.json pins pnpm with an integrity hash,
      # and corepack honours it without installing another toolchain manager on the runner.
      - name: Enable pnpm
        run: corepack enable

      # install:release is `pnpm install --frozen-lockfile --cpu=current,x64,arm64`: a default
      # install fetches native optional deps for the runner's CPU only, and the mac target builds
      # both x64 and arm64. See docs/reference/pnpm-install-policy.md.
      - name: Install dependencies
        run: pnpm install:release

      # Why: mobile/ is a separate pnpm project, so the root install leaves mobile/node_modules
      # empty and build:release's mobile-web bundle cannot resolve React Native or Expo.
      - uses: ./.github/actions/install-mobile-dependencies

      - name: Report signing mode
        run: |
          if [ -n "${{ secrets.MAC_CERTS }}" ]; then
            echo "Signing with Developer ID — auto-update will work."
          else
            echo "Building unsigned — the expected path for this fork. The app will notify about new releases and link to them; installs are manual."
          fi

      # Why a separate step: electron-builder only packages what is already built. Its beforePack
      # hook checks for the mobile-web bundle and aborts if the app was never compiled, which is
      # what a bare packaging run hits. build:release is the same script upstream's channels use.
      - name: Build the app
        run: pnpm build:release

      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only set when the secrets exist; electron-builder skips signing without them.
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # ORCA_MAC_RELEASE=1 turns on hardenedRuntime + notarization, which need the Apple
          # secrets. Without them the build must stay off that path or electron-builder fails
          # at the notarize step instead of producing an unsigned artifact.
          if [ -n "${CSC_LINK:-}" ]; then
            export ORCA_MAC_RELEASE=1
          else
            # Why unset rather than leave them empty: a missing secret still exports the variable as
            # an empty string, and electron-builder treats a *defined* CSC_LINK as "a certificate is
            # configured", then fails resolving "" as a path ("<workspace> not a file").
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          # Why always set: package.json carries upstream's version, never the fork's.
          echo "Packaging version: $RELEASE_VERSION"
          version_args=("-c.extraMetadata.version=$RELEASE_VERSION")
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          # Why --publish never: electron-builder publishes from each arch pass, and a draft release
          # does not reserve its tag, so the second pass cannot see the first one's release and
          # creates a second. Packaging locally and uploading once below is deterministic.
          pnpm exec electron-builder --config config/electron-builder.config.cjs --mac --publish never \
            "${version_args[@]+"${version_args[@]}"}"

      # One release, created once, with every artifact attached in a single call. latest-mac.yml is
      # the file the updater feed reads, so a release without it is invisible to installed copies.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"

          if [ ! -f dist/latest-mac.yml ]; then
            echo "::error::dist/latest-mac.yml is missing — the updater feed would 404. Refusing to publish."
            ls -la dist || true
            exit 1
          fi

          # Recreate rather than append: a re-run must not leave assets from a previous build
          # attached to the same tag.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            --latest \
            dist/latest-mac.yml \
            dist/*.dmg \
            dist/*.dmg.blockmap \
            dist/*-mac.zip \
            dist/*-mac.zip.blockmap

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort
